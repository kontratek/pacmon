[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacmon-python-fixture"
version = "0.1.0"
dependencies = [
  "requests>=2.31",
  "importlib_metadata>=7; python_version < '3.10'",
]

[project.optional-dependencies]
docs = ["sphinx>=7"]

[dependency-groups]
test = ["pytest>=8"]

[tool.poetry.group.lint.dependencies]
ruff = "^0.9"

[tool.uv]
dev-dependencies = ["mypy>=1"]
