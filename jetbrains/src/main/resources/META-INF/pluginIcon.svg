<!-- The plugin logo, shown on the Marketplace and in the Plugins dialog: the
     Pacmon mark on the dark disc, as in media/icon.png at the repository root.
     40x40 as the IntelliJ Platform asks, the disc 36 px across inside 2 px of
     padding. The mark is the 8x8 grid at 3 px a unit — bars 18x6, gaps 3, the
     top bar 6 in from the left — so every edge lands on a whole pixel. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <circle cx="20" cy="20" r="18" fill="#0A0A0A"/>
  <g fill="#00FF66">
    <rect x="14" y="8" width="18" height="6"/>
    <rect x="8" y="17" width="18" height="6"/>
    <rect x="8" y="26" width="18" height="6"/>
  </g>
</svg>
