name: Release

# Publishing is a button, never a side effect of merging. Actions -> Release ->
# Run workflow, pick patch / minor / major. The run raises the version, turns the
# CHANGELOG's "Unreleased" section into that version, runs the whole test suite,
# builds one VSIX and one JetBrains plugin zip, pushes the version commit and its
# tag to main, sends the VSIX to the Visual Studio Marketplace and to Open VSX,
# and submits the zip to the JetBrains Marketplace, which lists it after its own
# review. Both files go on the GitHub Release.
#
# A version number is spent the moment a registry accepts it, so nothing here is
# retried blindly. Every publish step skips a version the registry already has,
# and the version commit is skipped when its tag is already on the remote — so
# "Re-run failed jobs" is the recovery path after an expired token, and it
# cannot raise the version a second time. Run workflow with "none" publishes the
# version already in package.json to whichever registry still lacks it and
# commits nothing: the path for a registry that joined after a release.
#
# Tokens are the VSCE_PAT, OVSX_PAT and JETBRAINS_TOKEN repository secrets. See
# docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise. "none" publishes the version already in package.json to any registry that does not have it yet, and commits nothing.'
        required: true
        type: choice
        options: [patch, minor, major, none]
        default: patch
  # Escape hatch: a hand-pushed tag releases the version already in
  # package.json, whose CHANGELOG section must already exist.
  push:
    tags: ['v*']

permissions:
  contents: write # the version commit, the tag, and the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Anyone with write access can press the button; only these accounts get
      # past this step, and nothing has run yet when it fails. ACTOR arrives as
      # an environment variable rather than inline ${{ }} so a crafted login
      # cannot become shell.
      - name: Authorize actor
        env:
          ACTOR: ${{ github.actor }}
        run: |
          ALLOWED="yavuzatlas yavuzatlas-kontra"
          if echo " $ALLOWED " | grep -qF " $ACTOR "; then
            echo "Authorized: $ACTOR"
          else
            echo "::error::'$ACTOR' may not publish Pacmon (allowlist: $ALLOWED)."
            exit 1
          fi

      # Pinned to the triggering commit, so a re-run sees the identical tree and
      # computes the identical version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Set the version and the release notes
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$BUMP" != "none" ]; then
            # The notes are written under "## Unreleased" as work lands; the
            # release names that section.
            grep -q '^## Unreleased$' CHANGELOG.md || {
              echo "::error::CHANGELOG.md has no '## Unreleased' section."; exit 1; }
            if ! awk '/^## Unreleased$/{on=1;next} /^## /&&on{exit} on' CHANGELOG.md | grep -q '[^[:space:]]'; then
              echo "::error::The '## Unreleased' section is empty — write what changed before releasing."
              exit 1
            fi
            pnpm version "$BUMP" --no-git-tag-version --no-git-checks > /dev/null
            version=$(node -p "require('./package.json').version")
            # A fresh, empty "Unreleased" is left above it for the next round.
            sed -i "0,/^## Unreleased$/s//## Unreleased\n\n## $version — $(date -u +%Y-%m-%d)/" CHANGELOG.md
          else
            # A tag pushed by hand, or "none" from the button: the version already
            # in package.json goes out again, to whichever registry still lacks it.
            version=$(node -p "require('./package.json').version")
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null 2>&1; then
              echo "::error::v$version has not been released, so there is nothing to publish again; pick patch, minor or major."
              exit 1
            fi
          fi
          awk -v v="$version" '$0 ~ ("^## " v "([^0-9.]|$)") {on=1;next} /^## /&&on{exit} on' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # Everything below runs against the tree that actually ships.
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run pretest:integration
      - run: xvfb-run -a pnpm run test:integration

      # vsce package runs vscode:prepublish, which is the production build.
      - run: pnpm exec vsce package --no-dependencies -o pacmon.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: pacmon-vsix
          path: pacmon.vsix

      # The JetBrains plugin, from the same tree at the same version: its
      # build.gradle.kts reads the version the step above wrote to package.json
      # and renders that version's CHANGELOG section into the change notes. The
      # Plugin Verifier is not run here; CI runs it on every push to main.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: jetbrains
        run: ./gradlew test buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@v7
        with:
          name: pacmon-jetbrains
          path: jetbrains/build/distributions/*.zip

      # Git first: the history should record a release before the registries
      # can hand it to anyone. A push with the built-in token starts no further
      # workflow run, so main does not re-run CI for this commit.
      - name: Push the version commit and its tag
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG is already on the remote — resuming an earlier run, nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          git commit -m "Release $TAG"
          git tag -a "$TAG" -m "$TAG"
          # Fails rather than forces if main moved after the button was pressed.
          git push origin "HEAD:main"
          git push origin "$TAG"

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --packagePath pacmon.vsix --skip-duplicate
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec ovsx publish --packagePath pacmon.vsix --skip-duplicate

      # JetBrains reviews every version by hand before listing it, normally within
      # two business days, so this step submits rather than publishes. The
      # Marketplace refuses a version it already has, so a re-run asks the
      # plugin's update list first and skips, the way --skip-duplicate does above.
      - name: Submit to the JetBrains Marketplace
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
          PLUGIN_ID: 34295 # plugins.jetbrains.com/plugin/34295-pacmon
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: jetbrains
        run: |
          set -euo pipefail
          if curl -fsS -H "Authorization: Bearer $JETBRAINS_TOKEN" \
               "https://plugins.jetbrains.com/api/plugins/$PLUGIN_ID/updates?size=100" \
             | jq -e --arg v "$VERSION" 'any(.[]; .version == $v)' > /dev/null; then
            echo "The JetBrains Marketplace already has $VERSION - skipping."
          else
            ./gradlew publishPlugin
          fi

      # The Release carries the VSIX and the JetBrains zip, for anyone installing
      # without a registry.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" pacmon.vsix jetbrains/build/distributions/*.zip --clobber
          else
            gh release create "$TAG" pacmon.vsix jetbrains/build/distributions/*.zip --title "$TAG" --notes-file release-notes.md
          fi
